<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // Apply saved theme before first paint (default light) — avoids a flash.
      (function () {
        try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light'; }
        catch (e) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Indian Law AI Portal - AI-powered legal query assistant"
    />
    <title>Indian Law AI Portal</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
